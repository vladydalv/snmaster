name: Build macOS (AU + VST3, Universal)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Configure (arm64 + x86_64)
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Bundle baritone sax samples into SN Synth (Karoryfer Bear Sax, royalty-free)
        run: |
          curl -sSL -o bearsax.zip https://github.com/sfzinstruments/karoryfer.bear-sax/releases/download/v1.002/Karoryfer.Bear_Sax.v1.002.zip
          unzip -q bearsax.zip -d bearsax
          python3 tools/bundle_bearsax.py bearsax/Bear_Sax bearsax_bundle
          for B in "build/SpacenerdSynth_artefacts/Release/AU/Spacenerd Synth.component" "build/SpacenerdSynth_artefacts/Release/VST3/Spacenerd Synth.vst3"; do
            mkdir -p "$B/Contents/Resources"
            cp -R bearsax_bundle "$B/Contents/Resources/BearSax"
          done

      - name: Ad-hoc sign and package
        run: |
          mkdir -p dist
          for P in "Spacenerd Master:SpacenerdMaster" "Spacenerd Tone:SpacenerdTone" "Spacenerd Feedback:SpacenerdFeedback" "Spacenerd Era:SpacenerdEra" "Spacenerd Stomp:SpacenerdStomp" "Spacenerd Listen:SpacenerdListen" "Spacenerd Unmask:SpacenerdUnmask" "Spacenerd Decade:SpacenerdDecade" "Spacenerd Synth:SpacenerdSynth"; do
            NAME="${P%%:*}"; TARGET="${P##*:}"
            ART="build/${TARGET}_artefacts/Release"
            codesign --force --deep --sign - "$ART/AU/$NAME.component"
            codesign --force --deep --sign - "$ART/VST3/$NAME.vst3"
            echo "$NAME:"; lipo -archs "$ART/AU/$NAME.component/Contents/MacOS/$NAME"
            ditto -c -k --keepParent "$ART/AU/$NAME.component" "dist/$NAME AU.zip"
            ditto -c -k --keepParent "$ART/VST3/$NAME.vst3"    "dist/$NAME VST3.zip"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Spacenerd-Plugins-macOS
          path: dist/*.zip

      - name: Validate AU (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/*_artefacts/Release/AU/*.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -a | grep -i spacenerd || true
          auval -strict -v aufx Mstr Spcn
          auval -strict -v aufx Tone Spcn
          auval -strict -v aufx Fbck Spcn
          auval -strict -v aufx Erap Spcn
          auval -strict -v aufx Stmp Spcn
          auval -strict -v aufx Lstn Spcn
          auval -strict -v aufx Unmk Spcn
          auval -strict -v aufx Dcde Spcn
          auval -strict -v aumu Snth Spcn
